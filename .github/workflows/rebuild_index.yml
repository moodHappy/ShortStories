name: Rebuild ShortStories Calendar Index

# 触发条件：定时触发 + 手动触发 + 新精读笔记推送时触发 + 脚本更新时触发
on:
  schedule:
    - cron: '0 0 * * 1'  # 每周一北京时间早上 8:00 (UTC 00:00) 运行
  workflow_dispatch:     # 允许在 GitHub 网页上手动点击运行
  push:
    paths:
      - 'Summary/**'           # 只要 Summary 目录下有新的精读 HTML 推送上来，自动触发更新
      - 'generate_index.py'    # 当 Python 脚本本身发生更新时，自动触发更新

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 赋予机器人写入代码库的权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 升级到 v4，解决 Node.js 20 弃用警告

      - name: Set up Python
        uses: actions/setup-python@v5 # 升级到 v5，解决 Node.js 20 弃用警告
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Rebuild ShortStories Calendar Index
        # 修正为你实际的 Python 文件名
        run: python generate_index.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 使用 "." 追踪当前目录下的所有新增和变动，完美兼容 Summary 及其内部子文件夹
          git add .
          
          # 如果 index.html 或索引有变动，提交并推送到 ShortStories 仓库
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto rebuild ShortStories calendar index" && git push)
